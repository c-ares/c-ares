name: Build Release Package
on:
  push:
    branches:
      - main
      - 'v*'
    tags:
      - 'v*'

concurrency:
  group: ${{ github.ref }}-build-release-package
  cancel-in-progress: true

env:
  TEST_FILTER: "--gtest_filter=-*LiveSearchTXT*:*LiveSearchANY*"
  MAKE: make

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      discussions: write
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
      version: ${{ steps.version.outputs.version }}
    name: "build"
    steps:
      - name: Install packages
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: autoconf automake libtool g++ libgmock-dev pkg-config gdb
          version: 1.0
      - name: Checkout c-ares
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Get Tag version
        id: version
        run: |
          version=`echo ${GITHUB_REF} | grep '^refs/tags/v' | sed -e 's|^refs/tags/v\(.*\)|\1|'`
          if [ "$version" = "" ] ; then
            version="prerelease"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: "build c-ares tarball"
        run: |
          autoreconf -fi
          ./configure
          make dist
      - name: Generate subject
        id: hash
        run: |
          set -euo pipefail
          archive="c-ares-${{ steps.version.outputs.version }}.tar.gz"
          sha256="$(sha256sum "$archive" | cut -d' ' -f1)"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          echo "hashes=$(printf '%s  %s\n' "$sha256" "$archive" | base64 -w0)" >> "$GITHUB_OUTPUT"

      - name: Download Syft
        if: startsWith(github.ref, 'refs/tags/')
        id: syft
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          syft-version: v1.52.0

      - name: Generate release SBOMs
        if: startsWith(github.ref, 'refs/tags/')
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}
          VERSION: ${{ steps.version.outputs.version }}
          SHA256: ${{ steps.hash.outputs.sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          archive="c-ares-$VERSION.tar.gz"
          source_dir="$RUNNER_TEMP/c-ares-sbom-source"
          spdx="c-ares-$VERSION.spdx.json"
          cdx="c-ares-$VERSION.cdx.json"
          purl="pkg:github/${{ github.repository }}@v$VERSION"
          url="https://github.com/${{ github.repository }}/releases/download/v$VERSION/$archive"

          mkdir -p "$source_dir"
          tar -xzf "$archive" -C "$source_dir" --strip-components=1

          "$SYFT" scan "dir:$source_dir" \
            --source-name c-ares \
            --source-version "$VERSION" \
            --source-supplier "c-ares project" \
            -o "spdx-json=$spdx" \
            -o "cyclonedx-json=$cdx"

          root_id="$(
            jq -er '
              [
                .relationships[]
                | select(
                    .spdxElementId == "SPDXRef-DOCUMENT"
                    and .relationshipType == "DESCRIBES"
                  )
                | .relatedSpdxElement
              ]
              | if length == 1
                then .[0]
                else error("expected exactly one SPDX DESCRIBES root")
                end
            ' "$spdx"
          )"

          jq --arg id "$root_id" --arg sha "$SHA256" --arg url "$url" --arg purl "$purl" '
            (.packages[] | select(.SPDXID == $id)) |=
              (.licenseDeclared = "MIT"
               | .downloadLocation = $url
               | .primaryPackagePurpose = "LIBRARY"
               | .checksums = (
                   ((.checksums // []) + [{
                     "algorithm": "SHA256",
                     "checksumValue": $sha
                   }])
                   | unique_by([.algorithm, .checksumValue])
                 )
               | .externalRefs = (
                   ((.externalRefs // []) + [{
                     "referenceCategory": "PACKAGE-MANAGER",
                     "referenceType": "purl",
                     "referenceLocator": $purl
                   }])
                   | unique_by([
                       .referenceCategory,
                       .referenceType,
                       .referenceLocator
                     ])
                 ))
          ' "$spdx" > "$spdx.tmp"
          mv "$spdx.tmp" "$spdx"

          jq --arg sha "$SHA256" --arg url "$url" --arg purl "$purl" '
            .metadata.component.type = "library"
            | .metadata.component.supplier = {"name": "c-ares project"}
            | .metadata.component.hashes = (
                ((.metadata.component.hashes // []) + [{
                  "alg": "SHA-256",
                  "content": $sha
                }])
                | unique_by([.alg, .content])
              )
            | .metadata.component.licenses = (
                ((.metadata.component.licenses // []) + [{
                  "license": {"id": "MIT"}
                }])
                | unique_by([
                    (.license.id // ""),
                    (.expression // "")
                  ])
              )
            | .metadata.component.purl = $purl
            | .metadata.component.externalReferences = (
                ((.metadata.component.externalReferences // []) + [{
                  "type": "distribution",
                  "url": $url
                }])
                | unique_by([.type, .url])
              )
          ' "$cdx" > "$cdx.tmp"
          mv "$cdx.tmp" "$cdx"

      - name: Validate release SBOMs
        if: startsWith(github.ref, 'refs/tags/')
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SHA256: ${{ steps.hash.outputs.sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          spdx="c-ares-$VERSION.spdx.json"
          cdx="c-ares-$VERSION.cdx.json"
          purl="pkg:github/${{ github.repository }}@v$VERSION"
          validator=sbom-utility-v0.19.2-linux-amd64.tar.gz

          curl -fsSLO "https://github.com/CycloneDX/sbom-utility/releases/download/v0.19.2/$validator"
          echo "e0cd37e6e67b1d0e44dbb7b38e055a4e2ee66db590bb8e7f89e2d9b650f4490b  $validator" |
            sha256sum -c -
          tar -xzf "$validator" sbom-utility

          ./sbom-utility validate -q -i "$spdx"
          ./sbom-utility validate -q -i "$cdx"

          jq -e --arg version "$VERSION" --arg sha "$SHA256" --arg purl "$purl" '
            [
              .relationships[]
              | select(
                  .spdxElementId == "SPDXRef-DOCUMENT"
                  and .relationshipType == "DESCRIBES"
                )
              | .relatedSpdxElement
            ] as $roots
            | ($roots | length) == 1
            and (
              .packages[]
              | select(.SPDXID == $roots[0])
              | .name == "c-ares"
              and .versionInfo == $version
              and any(.checksums[]?; .algorithm == "SHA256" and .checksumValue == $sha)
              and any(.externalRefs[]?; .referenceType == "purl" and .referenceLocator == $purl)
            )
          ' "$spdx" >/dev/null

          jq -e --arg version "$VERSION" --arg sha "$SHA256" --arg purl "$purl" '
            .specVersion == "1.7"
            and .metadata.component.type == "library"
            and .metadata.component.name == "c-ares"
            and .metadata.component.version == $version
            and .metadata.component.purl == $purl
            and any(.metadata.component.hashes[]?; .alg == "SHA-256" and .content == $sha)
          ' "$cdx" >/dev/null

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "c-ares-src-tarball"
          path: 'c-ares-*.tar.gz'
          if-no-files-found: error
          overwrite: true
          retention-days: 7

      - name: Upload Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          body_path: RELEASE-NOTES.md
          draft: true
          make_latest: true
          name: ${{ steps.version.outputs.version }}
          files: |
            c-ares-${{ steps.version.outputs.version }}.tar.gz
            c-ares-${{ steps.version.outputs.version }}.spdx.json
            c-ares-${{ steps.version.outputs.version }}.cdx.json
          fail_on_unmatched_files: true
          discussion_category_name: "Announcements"

  provenance:
    needs: [build]
    permissions:
      actions: read # To read the workflow path.
      id-token: write # To sign the provenance.
      contents: write # To add assets to a release.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: "${{ needs.build.outputs.hashes }}"
      upload-tag-name: "${{ needs.build.outputs.version }}"
      draft-release: true
      # NOTE: Due to issue with duplicating a draft, we need to download the provenance and
      #       upload it ourselves via the "upload-provenance" step.
      # upload-assets: ${{ startsWith(github.ref, 'refs/tags/') }}
      upload-assets: false
      provenance-name: "c-ares-${{ needs.build.outputs.version }}.intoto.jsonl"

  upload-provenance:
    needs: [build, provenance]
    runs-on: ubuntu-latest
    permissions:
      actions: read # To read the workflow path.
      contents: write # To add assets to a release.
    steps:
      - name: Download the provenance
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{needs.provenance.outputs.provenance-name}}
      - name: Upload Provenance to Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        if: startsWith(github.ref, 'refs/tags/')
        id: upload-provenance
        with:
          name: ${{ needs.build.outputs.version }}
          draft: true
          files: ${{needs.provenance.outputs.provenance-name}}
          fail_on_unmatched_files: true
